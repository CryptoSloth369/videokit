[project]
name = "videokit-mcp"
version = "0.1.0"
description = "MCP server that makes videos with several code-to-video engines"
requires-python = ">=3.13"
dependencies = [
    "mcp>=1.20",
    "pyyaml>=6.0.3",
]

[project.scripts]
videokit-mcp = "videokit_mcp:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
